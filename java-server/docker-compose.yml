# docker-compose.yml
version: '3.8' # Specifies the docker-compose version

services:
  java-server: # Defines a service named 'java-server'
    build:
      context: . # Specifies the build context (directory containing the Dockerfile)
      dockerfile: Dockerfile # Specifies the name of the Dockerfile
    ports:
      - "8080:8080" # Example: Maps port 8080 on the host to port 8080 in the container
                    # Adjust this if your Java application listens on a different port
    container_name: my-java-app # Optional: Assigns a specific name to the container
